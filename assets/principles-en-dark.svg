<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434" width="900" height="434" role="img" aria-label="Fixed price: If the budget has to change, you hear it at once. Nothing changes without your approval. No agreement, no start: If we do not agree on price or approach, work does not start and you pay nothing. Straight talk: Regular calls about the project and demos of work in progress. The brief before the design: First what the work should do and for whom, then how it looks. Measure, then automate: Keep what saves time, switch off what does not. One person, no hand-offs: You talk to the one who builds it, not to a chain of salesperson and designer."><path d="M0 0 H426 L442 16 V134 H0 Z" fill="#131318" stroke="rgba(233,232,227,0.12)"/><path transform="translate(32 32) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="76" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e9e8e3">Fixed price</text><text x="26" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">If the budget has to change, you hear it at once. Nothing</text><text x="26" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">changes without your approval.</text><path d="M458 0 H884 L900 16 V134 H458 Z" fill="#131318" stroke="rgba(233,232,227,0.12)"/><path transform="translate(490 32) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="534" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e9e8e3">No agreement, no start</text><text x="484" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9191