<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434" width="900" height="434" role="img" aria-label="Pevná cena: Pokud by bylo potřeba rozpočet upravit, dozvíte se to hned. Bez vašeho schválení se nic nemění. Bez dohody se nezačíná: Když se na ceně nebo postupu nedohodneme, práce nezačne a nic neplatíte. Na rovinu: Pravidelné hovory o stavu projektu a ukázky rozpracované práce. Zadání před designem: Nejdřív co má práce dělat a pro koho, potom jak vypadá. Změřit, pak automatizovat: Co šetří čas, zůstane. Co nešetří, vypneme. Jeden člověk, bez předávání: Mluvíte s tím, kdo to staví — ne přes obchodníka a designéra."><path d="M0 0 H426 L442 16 V134 H0 Z" fill="#131318" stroke="rgba(233,232,227,0.12)"/><path transform="translate(32 32) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="76" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e9e8e3">Pevná cena</text><text x="26" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">Pokud by bylo potřeba rozpočet upravit, dozvíte se to</text><text x="26" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">hned. Bez vašeho schválení se nic nemění.</text><path d="M458 0 H884 L900 16 V134 H458 Z" fill="#131318" stroke="rgba(233,232,227,0.12)"/><path transform="translate(490 32) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="534" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e9e8e3">Bez dohody se nezačíná</text><text x="484" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">Když se na ceně nebo postupu nedohodneme, práce nezačne a</text><text x="484" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">nic neplatíte.</text><path d="M0 150 H426 L442 166 V284 H0 Z" fill="#131318" stroke="rgba(233,232,227,0.12)"/><path transform="translate(32 182) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="76" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e9e8e3">Na rovinu</text><text x="26" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">Pravidelné hovory o stavu projektu a ukázky rozpracované</text><text x="26" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">práce.</text><path d="M458 150 H884 L900 166 V284 H458 Z" fill="#131318" stroke="rgba(233,232,227,0.12)"/><path transform="translate(490 182) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="534" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e9e8e3">Zadání před designem</text><text x="484" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">Nejdřív co má práce dělat a pro koho, potom jak vypadá.</text><path d="M0 300 H426 L442 316 V434 H0 Z" fill="#131318" stroke="rgba(233,232,227,0.12)"/><path transform="translate(32 332) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="76" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e9e8e3">Změřit, pak automatizovat</text><text x="26" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">Co šetří čas, zůstane. Co nešetří, vypneme.</text><path d="M458 300 H884 L900 316 V434 H458 Z" fill="#131318" stroke="rgba(233,232,227,0.12)"/><path transform="translate(490 332) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="534" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e9e8e3">Jeden člověk, bez předávání</text><text x="484" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">Mluvíte s tím, kdo to staví — ne přes obchodníka a</text><text x="484" y="409" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#91919a">designéra.</text></svg>
