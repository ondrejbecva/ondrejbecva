<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Pevná cena: Pokud by bylo potřeba rozpočet upravit, dozvíte se to hned. Bez vašeho schválení se nic nemění. Bez dohody se nezačíná: Když se na ceně nebo postupu nedohodneme, práce nezačne a nic neplatíte. Na rovinu: Pravidelné hovory o stavu projektu a ukázky rozpracované práce. Zadání před designem: Nejdřív co má práce dělat a pro koho, potom jak vypadá. Změřit, pak automatizovat: Co šetří čas, zůstane. Co nešetří, vypneme. Jeden člověk, bez předávání: Mluvíte s tím, kdo to staví — ne přes obchodníka a designéra."><path d="M0 0 H426 L442 16 V116 H0 Z" fill="#ffffff" stroke="rgba(17,17,15,0.14)"/><path transform="translate(32 30) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="76" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#11110f">Pevná cena</text><text x="26" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c5c62">Pokud by bylo potřeba rozpočet upravit, dozvíte se to</text><text x="26" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c5c62">hned. Bez vašeho schválení se nic nemění.</text><path d="M458 0 H884 L900 16 V116 H458 Z" fill="#ffffff" stroke="rgba(17,17,15,0.14)"/><path transform="translate(490 30) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="534" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#11110f">Bez dohody se nezačíná</text><text x="484" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c5c62">Když se na ceně nebo postupu nedohodneme, práce nezačne a</text><text x="484" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c5c62">nic neplatíte.</text><path d="M0 132 H426 L442 148 V248 H0 Z" fill="#ffffff" stroke="rgba(17,17,15,0.14)"/><path transform="translate(32 162) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="76" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#11110f">Na rovinu</text><text x="26" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c5c62">Pravidelné hovory o stavu projektu a ukázky rozpracované</text><text x="26" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c5c62">práce.</text><path d="M458 132 H884 L900 148 V248 H458 Z" fill="#ffffff" stroke="rgba(17,17,15,0.14)"/><path transform="translate(490 162) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="534" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#11110f">Zadání před designem</text><text x="484" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c5c62">Nejdřív co má práce dělat a pro koho, potom jak vypadá.</text><path d="M0 264 H426 L442 280 V380 H0 Z" fill="#ffffff" stroke="rgba(17,17,15,0.14)"/><path transform="translate(32 294) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="76" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#11110f">Změřit, pak automatizovat</text><text x="26" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c5c62">Co šetří čas, zůstane. Co nešetří, vypneme.</text><path d="M458 264 H884 L900 280 V380 H458 Z" fill="#ffffff" stroke="rgba(17,17,15,0.14)"/><path transform="translate(490 294) scale(2)" fill-rule="evenodd" fill="#7a6cff" d="M6 0l6 6-6 6-6-6 6-6zm0 3.4L2.6 6 6 8.6 9.4 6 6 3.4z"/><text x="534" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#11110f">Jeden člověk, bez předávání</text><text x="484" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c5c62">Mluvíte s tím, kdo to staví — ne přes obchodníka a</text><text x="484" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5c5c62">designéra.</text></svg>
